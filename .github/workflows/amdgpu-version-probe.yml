name: Read existing AMDGPU versions

on:
  push:
    branches:
      - users/y1k2chaitanya/amdgpu-version-probe-20260917
    paths:
      - .github/workflows/amdgpu-version-probe.yml

permissions:
  contents: read

jobs:
  pick_runner:
    name: Find an idle GPU runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      label: ${{ steps.pick.outputs.label }}
    steps:
      - name: Read runner inventory with the existing health app
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RUNNER_HEALTH_APP_ID }}
          private-key: ${{ secrets.RUNNER_HEALTH_PRIVATE_KEY }}
          owner: ROCm
      - name: Select an idle persistent runner or request an ARC GPU
        id: pick
        env:
          RUNNER_TOKEN: ${{ steps.app.outputs.token }}
        shell: 'python3 {0}'
        run: |
          import json, os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          wanted = {'linux-gfx1151-gpu-rocm', 'linux-gfx1100-gpu-rocm-devops-qa',
                    'linux-gfx1101-gpu-rocm-devops-qa'}
          chosen = None
          for scope in ('repos/ROCm/rocm-tests', 'orgs/ROCm'):
              for page in range(1, 21):
                  req = Request(f'https://api.github.com/{scope}/actions/runners?per_page=100&page={page}',
                                headers={'Authorization': 'Bearer ' + os.environ['RUNNER_TOKEN'],
                                         'Accept': 'application/vnd.github+json'})
                  try:
                      with urlopen(req, timeout=15) as response:
                          runners = json.load(response)['runners']
                  except HTTPError as exc:
                      print(f'{scope}: runner inventory returned HTTP {exc.code}')
                      break
                  for runner in runners:
                      labels = {label['name'] for label in runner['labels']}
                      matches = sorted(labels & wanted)
                      if matches:
                          print(json.dumps({'runner': runner['name'], 'labels': matches,
                                            'status': runner['status'], 'busy': runner['busy']}))
                          if runner['status'] == 'online' and not runner['busy']:
                              chosen = matches[0]
                              break
                  if chosen or len(runners) < 100:
                      break
              if chosen:
                  break
          if not chosen:
              chosen = 'linux-mi355-1gpu-ossci-rocm'
              print('No idle persistent target found; requesting one GPU from the ARC runner pool')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'label={chosen}\n')
          print(f'Selected runner label: {chosen}')

  versions:
    name: Read versions on an available GPU runner
    needs: pick_runner
    runs-on: ${{ needs.pick_runner.outputs.label }}
    timeout-minutes: 5
    steps:
      - name: Read current kernel, driver, packages, and GPU activity
        shell: 'python3 {0}'
        run: |
          from datetime import datetime, timezone
          import glob
          import json
          import os
          from pathlib import Path
          import platform
          import shutil
          import socket
          import subprocess

          def read(path):
              try:
                  return Path(path).read_text().strip()
              except (OSError, UnicodeError):
                  return None

          def command(args):
              if not shutil.which(args[0]):
                  return {'available': False}
              try:
                  result = subprocess.run(args, text=True, capture_output=True, timeout=20)
                  return {'returncode': result.returncode, 'stdout': result.stdout.strip(),
                          'stderr': result.stderr.strip()}
              except subprocess.TimeoutExpired:
                  return {'error': 'timed out'}

          os_release = {}
          for line in (read('/etc/os-release') or '').splitlines():
              if '=' in line:
                  key, value = line.split('=', 1)
                  if key in ('ID', 'VERSION_ID', 'PRETTY_NAME'):
                      os_release[key] = value.strip('"')

          cards = []
          for card in sorted(Path('/sys/class/drm').glob('card[0-9]*')):
              if '-' in card.name or read(card / 'device/vendor') != '0x1002':
                  continue
              cards.append({'card': card.name, 'pci_device_id': read(card / 'device/device'),
                            'gpu_busy_percent': read(card / 'device/gpu_busy_percent'),
                            'vram_used_bytes': read(card / 'device/mem_info_vram_used')})

          versions = {}
          for filename in sorted(glob.glob('/opt/rocm*/.info/version*')):
              if Path(filename).is_file():
                  versions[filename] = read(filename)

          module_tree = Path('/lib/modules') / platform.release()
          visible_module_files = []
          if module_tree.is_dir():
              for directory, _, filenames in os.walk(module_tree):
                  for filename in filenames:
                      if filename == 'amdgpu.ko' or filename.startswith('amdgpu.ko.'):
                          visible_module_files.append(str(Path(directory) / filename))
          driver_links = {}
          for card in cards:
              path = Path('/sys/class/drm') / card['card'] / 'device/driver/module'
              driver_links[card['card']] = str(path.resolve()) if path.exists() else None

          result = {
              'checked_at_utc': datetime.now(timezone.utc).isoformat(),
              'runner_name': os.environ.get('RUNNER_NAME'),
              'hostname': socket.gethostname(),
              'os_release': os_release,
              'kernel': platform.release(),
              'kernel_version_signature': read('/proc/version_signature'),
              'kernel_version': read('/proc/version'),
              'container_marker_present': Path('/.dockerenv').exists() or Path('/run/.containerenv').exists(),
              'pid1': read('/proc/1/comm'),
              'loaded_amdgpu': {'version': read('/sys/module/amdgpu/version'),
                                'srcversion': read('/sys/module/amdgpu/srcversion'),
                                'taint': read('/sys/module/amdgpu/taint'),
                                'initstate': read('/sys/module/amdgpu/initstate'),
                                'proc_modules_entry': [line for line in (read('/proc/modules') or '').splitlines()
                                                       if line.startswith('amdgpu ')]},
              'kernel_module_tree_visible': module_tree.is_dir(),
              'amdgpu_module_files_in_runner_environment': sorted(visible_module_files),
              'gpu_driver_module_links': driver_links,
              'disk_amdgpu_version': command(['modinfo', '-F', 'version', 'amdgpu']),
              'disk_amdgpu_file': command(['modinfo', '-F', 'filename', 'amdgpu']),
              'dkms': command(['dkms', 'status']),
              'packages_in_runner_environment': command([
                  'dpkg-query', '-W', '-f=${binary:Package}\t${Version}\t${db:Status-Abbrev}\n',
                  'amdgpu-dkms', 'amdgpu-dkms-firmware', 'amdgpu-install', 'rocm-core', 'hip-runtime-amd']),
              'rocm_version_files_in_runner_environment': versions,
              'gpu_activity': cards,
              'kfd_present': Path('/dev/kfd').exists(),
              'render_devices': sorted(glob.glob('/dev/dri/renderD*')),
          }
          output = json.dumps(result, indent=2)
          Path('version-probe.json').write_text(output + '\n')
          print(output)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Existing AMDGPU versions\n\n```json\n' + output + '\n```\n')

      - name: Upload version snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: amdgpu-version-snapshot-${{ github.run_attempt }}
          path: version-probe.json
          retention-days: 3
