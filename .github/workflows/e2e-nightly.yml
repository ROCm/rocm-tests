# SPDX-License-Identifier: MIT
#
# e2e-nightly workflow — top-level trigger for ROCm end-to-end nightly tests.
#
# Layer structure (2-layer):
#   [Setup test matrix]
#        └── [E2E Nightly — <run_id>]            (matrix — one cell per platform)
#                ├─ e2e: linux-gfx94x             (green — target_available=true)
#                └─ e2e: linux-gfx110X            (grey/skipped — target_available=false)
#        └── [Nightly Results — <run_id> — All Platforms]
#
# Each matrix cell calls e2e-tests.yml which contains a single job named
# "e2e: <platform>". When target_available=false the job-level if: guard
# skips the job entirely — no runner is consumed and the cell shows grey.
#
# Inputs:
#   source_repo     — ROCm/TheRock or ROCm/rockrel
#   artifact_source — behaviour depends on source_repo:
#       ROCm/TheRock  : "latest-release" (full artifact tarball, default)
#                       OR a release tag (e.g. "nightly-2026-05-25")
#       ROCm/rockrel  : workflow filename (e.g. "build.yml"); setup_matrix
#                       resolves the latest completed run_id via the GitHub API
#   include_dev     — rockrel path only: also download _dev archives
#                     (headers, CMake configs, static libs).

name: ROCm Nightly Tests

on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 AM UTC daily

  push:
    branches:
      - users/mparamas/runners-check

  workflow_call:
    inputs:
      source_repo:
        description: 'Source repository: ROCm/TheRock or ROCm/rockrel'
        type: string
        default: ROCm/rockrel
      artifact_source:
        description: >
          ROCm/TheRock: "latest-release" OR a release tag.
          ROCm/rockrel: workflow filename (e.g. "multi_arch_release.yml") whose latest
          run_id is resolved automatically.
        type: string
        default: multi_arch_release.yml
      include_dev:
        description: >
          For ROCm/rockrel: Download _dev artifacts needed for test binary compilation.
        type: boolean
        default: true

  workflow_dispatch:
    inputs:
      source_repo:
        description: 'GitHub repo to pull artifacts from'
        type: choice
        options:
          - ROCm/rockrel
          - ROCm/TheRock
        default: ROCm/rockrel

      artifact_source:
        description: >
          ROCm/TheRock: "latest-release" OR a release tag.
          ROCm/rockrel: workflow filename (e.g. "multi_arch_release.yml") whose latest
          run_id is resolved automatically.
        type: string
        default: 'multi_arch_release.yml'

      include_dev:
        description: >
          For ROCm/rockrel: Download _dev artifacts needed for test binary compilation.
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  setup_matrix:
    name: Setup test matrix
    runs-on: ubuntu-latest
    outputs:
      targets:         ${{ steps.testplan.outputs.targets }}
      skipped_targets: ${{ steps.testplan.outputs.skipped_targets }}
      runner_check_status: ${{ steps.testplan.outputs.runner_check_status }}
      run_id:          ${{ steps.get_runid.outputs.run_id }}
    steps:
      - name: Checkout rocm-tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Resolve rockrel run_id from workflow name
        id: get_runid
        if: ${{ (inputs.source_repo || 'ROCm/rockrel') == 'ROCm/rockrel' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REPO: ${{ inputs.source_repo || 'ROCm/rockrel' }}
          ARTIFACT_SOURCE: ${{ inputs.artifact_source || 'multi_arch_release.yml' }}
        shell: python
        run: |
          import json, os
          from urllib.request import urlopen, Request
          repo     = os.environ["SOURCE_REPO"]
          workflow = os.environ["ARTIFACT_SOURCE"]
          url = (
            f'https://api.github.com/repos/{repo}/actions/workflows/'
            f'{workflow}/runs?status=completed&event=schedule&branch=main&per_page=1'
          )
          req = Request(url, headers={
            'Authorization': f'Bearer {os.environ["GITHUB_TOKEN"]}',
            'Accept': 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
          })
          with urlopen(req) as resp:
            data = json.loads(resp.read())
          run_id = data['workflow_runs'][0]['id']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f'run_id={run_id}\n')
          print(f'Latest completed run of {repo}/{workflow}: {run_id}')

      - name: Create runner health app token
        id: runner-health-token
        uses: actions/create-github-app-token@2e564a0bb8e7cc2b907b2401a2afe177882d4325 # v3.0.0
        with:
          app-id: ${{ secrets.RUNNER_HEALTH_APP_ID }}
          private-key: ${{ secrets.RUNNER_HEALTH_PRIVATE_KEY }}
          owner: ROCm
          repositories: rocm-tests

      - name: Build test matrix from Test Configuration
        id: testplan
        env:
          GH_TOKEN: ${{ steps.runner-health-token.outputs.token }}
          GH_OWNER: ROCm
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: python
        run: |
          import configparser
          import json
          import os
          import subprocess
          import time
          from concurrent.futures import ThreadPoolExecutor, as_completed

          POLL_INTERVAL_SECS = 15
          POLL_TIMEOUT_SECS  = 15 * 60   # 15 minutes

          def _append_output(**kwargs):
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  for key, value in kwargs.items():
                      payload = value if isinstance(value, str) else json.dumps(value)
                      f.write(f'{key}={payload}\n')

          def _collect_runners(endpoint, target_label=None):
              """Paginate a GitHub runner API endpoint and return a normalised list.

              Prints the endpoint, per-page timing, and runner counts so that
              a hang in ``gh api`` is immediately visible in the workflow log.

              If ``target_label`` is given, pagination stops as soon as an idle
              runner carrying that label is found — avoids fetching all remaining
              pages when the target runner appears early in a large pool.
              """
              token = os.environ.get('GH_TOKEN', '').strip()
              if not token:
                  raise PermissionError('GH_TOKEN is not configured')

              runners = []
              page = 1
              print(f'  → querying {endpoint} …', flush=True)
              while True:
                  t0 = time.monotonic()
                  print(f'    gh api {endpoint}?per_page=100&page={page} (timeout=30s)', flush=True)
                  completed = subprocess.run(
                      ['gh', 'api', f'{endpoint}?per_page=100&page={page}'],
                      text=True,
                      capture_output=True,
                      check=False,
                      timeout=30,
                  )
                  elapsed = time.monotonic() - t0
                  if completed.returncode != 0:
                      stderr = completed.stderr.strip() or completed.stdout.strip()
                      print(f'    ✗ failed in {elapsed:.1f}s: {stderr}', flush=True)
                      raise RuntimeError(f'gh api runner inventory failed for {endpoint}: {stderr}')

                  data = json.loads(completed.stdout)
                  batch = data.get('runners', [])
                  idle_on_page = busy_on_page = offline_on_page = 0
                  for runner in batch:
                      if runner.get('status') == 'offline':
                          status = 'unavailable'
                          offline_on_page += 1
                      elif runner.get('busy'):
                          status = 'running'
                          busy_on_page += 1
                      else:
                          status = 'idle'
                          idle_on_page += 1
                      runners.append(
                          {
                              'name': runner.get('name', ''),
                              'status': status,
                              'labels': [label.get('name', '') for label in runner.get('labels', [])],
                          }
                      )
                  print(
                      f'    ✓ page {page}: {len(batch)} runner(s) in {elapsed:.1f}s'
                      f' [idle={idle_on_page} busy={busy_on_page} offline={offline_on_page}]',
                      flush=True,
                  )

                  # Early exit: stop fetching further pages once we already have
                  # an idle runner with the target label — the remaining pages
                  # cannot change the outcome for this section.
                  if target_label:
                      idle_match = any(
                          r['status'] == 'idle' and target_label in r['labels']
                          for r in runners
                      )
                      if idle_match:
                          print(
                              f'    → early exit after page {page}:'
                              f' idle runner found for label {target_label!r}'
                              f' ({len(runners)} runner(s) scanned so far)',
                              flush=True,
                          )
                          return runners

                  if len(batch) < 100:
                      print(
                          f'  → done: {len(runners)} total runner(s) across {page} page(s)',
                          flush=True,
                      )
                      return runners
                  page += 1

          def _labels_for(runners):
              labels = set()
              for runner in runners:
                  labels.update(runner.get('labels', []))
              return labels

          def _merge_runners(*runner_sets):
              merged = {}
              for runners in runner_sets:
                  for runner in runners:
                      merged[runner.get('name', '')] = runner
              return list(merged.values())

          def _load_runners(required_labels, context=''):
              """Return repository + org runners for the given label set.

              Falls back to the org endpoint only when a required label is absent
              from the repo runner list.  Every step is logged so the source of a
              hang is unambiguous.

              When ``required_labels`` contains exactly one label, that label is
              forwarded to ``_collect_runners`` as ``target_label`` so pagination
              can stop as soon as an idle match is found.
              """
              repo = os.environ['GITHUB_REPOSITORY']
              org  = os.environ.get('GH_OWNER', repo.split('/', 1)[0])
              tag  = f'[{context}] ' if context else ''

              # Single-label callers (per-section poll threads) get early-exit
              # pagination; multi-label callers always scan all pages.
              target_label = next(iter(required_labels)) if len(required_labels) == 1 else None

              print(f'{tag}Fetching repo runners (repos/{repo}/actions/runners)', flush=True)
              try:
                  repo_runners = _collect_runners(f'repos/{repo}/actions/runners', target_label=target_label)
              except subprocess.TimeoutExpired as exc:
                  raise RuntimeError(
                      f'Repo runner API timed out for repos/{repo}/actions/runners'
                  ) from exc
              repo_labels = _labels_for(repo_runners)
              # Only labels borne by at least one ONLINE runner count as "present".
              # An offline-only runner would wrongly suppress the org lookup, hiding
              # potentially idle org runners carrying the same label.
              online_repo_labels = {
                  label
                  for r in repo_runners
                  if r['status'] != 'unavailable'
                  for label in r['labels']
              }
              print(
                  f'{tag}Repo runners: {len(repo_runners)} total'
                  f' (online labels: {sorted(online_repo_labels)})',
                  flush=True,
              )

              missing = set(required_labels) - online_repo_labels
              if not missing:
                  print(
                      f'{tag}All required labels present in online repo runners — skipping org lookup',
                      flush=True,
                  )
                  return repo_runners

              print(
                  f'{tag}Label(s) not in repo runners: {sorted(missing)}'
                  f' — fetching org runners (orgs/{org}/actions/runners)',
                  flush=True,
              )
              try:
                  org_runners = _collect_runners(f'orgs/{org}/actions/runners', target_label=target_label)
                  org_labels  = _labels_for(org_runners)
                  print(f'{tag}Org runners: {len(org_runners)} total, labels seen: {sorted(org_labels)}', flush=True)
              except (RuntimeError, subprocess.TimeoutExpired) as exc:
                  missing_labels = ', '.join(sorted(missing))
                  raise RuntimeError(
                      'Repository runner inventory does not include required label(s): '
                      f'{missing_labels}. These may be under "Shared with this repository"; '
                      'GH_TOKEN must be able to read organization runner inventory to avoid unsafe scheduling. '
                      f'Original error: {exc}'
                  ) from exc
              return _merge_runners(repo_runners, org_runners)

          def _runner_state(runners, required_label):
              matching    = []
              online_idle = []
              online_busy = []
              for runner in runners:
                  labels = set(runner.get('labels', []))
                  if required_label not in labels:
                      continue
                  matching.append(runner)
                  if runner.get('status') == 'idle':
                      online_idle.append(runner)
                  elif runner.get('status') == 'running':
                      online_busy.append(runner)
              return {
                  'matching':     len(matching),
                  'online_idle':  len(online_idle),
                  'online_busy':  len(online_busy),
              }

          def _poll_one_section(entry, deadline):
              """Poll a single label independently until an idle runner appears
              or the shared deadline expires.

              Each label runs in its own thread so fast runners are not held
              back by sections whose runners are still busy or offline.
              Returns ``(entry, available: bool, skip_reason: str)``.
              """
              section = entry['name']
              runs_on = entry.get('runs_on', '').strip()
              tag     = f'[{section}]'

              print(f'{tag} Starting poll for label {runs_on!r}', flush=True)

              # last_state persists across iterations so the timeout reason
              # reflects the most recent known runner state, not the initial zeros.
              last_state = {'matching': 0, 'online_idle': 0, 'online_busy': 0}

              def _timeout_reason(s):
                  if s['matching'] == 0:
                      return f'No runner found for label {runs_on!r} after {POLL_TIMEOUT_SECS // 60}m'
                  if s['online_busy'] > 0:
                      return (
                          f'Runner(s) still busy for label {runs_on!r}'
                          f' after {POLL_TIMEOUT_SECS // 60}m'
                      )
                  return (
                      f'Runner(s) offline for label {runs_on!r}'
                      f' after {POLL_TIMEOUT_SECS // 60}m'
                  )

              attempt = 0
              while True:
                  # Pre-flight deadline check — avoids starting a new round of
                  # API calls (potentially 2 × 30 s) when time has already run out.
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      reason = _timeout_reason(last_state)
                      print(
                          f'{tag} ✗ deadline reached before attempt {attempt + 1} — {reason}',
                          flush=True,
                      )
                      return entry, False, reason

                  attempt += 1
                  print(
                      f'{tag} Attempt {attempt} — fetching runner state ({int(remaining)}s remaining)',
                      flush=True,
                  )

                  try:
                      # Each label thread fetches only its own label's runners
                      # to keep the API surface minimal.
                      runners = _load_runners({runs_on}, context=section)
                  except (json.JSONDecodeError, OSError, PermissionError,
                          RuntimeError, subprocess.TimeoutExpired) as exc:
                      print(f'{tag} ✗ runner inventory fetch failed: {exc}', flush=True)
                      runners = []

                  last_state = _runner_state(runners, runs_on)
                  print(
                      f'{tag} label={runs_on!r}  '
                      f'matching={last_state["matching"]}  '
                      f'idle={last_state["online_idle"]}  '
                      f'busy={last_state["online_busy"]}',
                      flush=True,
                  )

                  if last_state['online_idle'] > 0:
                      print(f'{tag} ✓ idle runner found — marking available', flush=True)
                      return entry, True, ''

                  # Post-API-call deadline check — the API calls themselves may
                  # have consumed most of the remaining window.
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      reason = _timeout_reason(last_state)
                      print(
                          f'{tag} ✗ deadline reached after attempt {attempt} — {reason}',
                          flush=True,
                      )
                      return entry, False, reason

                  wait = min(POLL_INTERVAL_SECS, remaining)
                  print(f'{tag} Waiting {int(wait)}s before next poll …', flush=True)
                  time.sleep(wait)

          # ── Load testplan ──────────────────────────────────────────────────
          conf = configparser.ConfigParser()
          conf.read('testplan.ini')

          required_labels = {
              conf.get(section, 'runs_on', fallback='').strip()
              for section in conf.sections()
              if conf.get(section, 'target_available', fallback='true').strip().lower() != 'false'
          }
          required_labels.discard('')

          print(f'Enabled sections require labels: {sorted(required_labels)}', flush=True)

          all_targets = []
          skipped     = []
          resolved    = {}
          runner_check_status = ''

          # ── Disabled sections — resolve immediately ─────────────────────────
          disabled_sections = []
          pending_sections  = []
          for section in conf.sections():
              entry = {'name': section, **dict(conf.items(section))}
              if entry.get('target_available', 'true').strip().lower() == 'false':
                  disabled_sections.append(entry)
              else:
                  pending_sections.append(entry)

          for entry in disabled_sections:
              entry['target_available'] = 'false'
              entry['skip_reason']      = 'Target disabled in testplan.ini'
              skipped.append({'name': entry['name'], 'reason': entry['skip_reason']})
              print(f"[{entry['name']}] Skipped — disabled in testplan.ini", flush=True)
              all_targets.append(entry)

          # ── Enabled sections — poll all labels in parallel ──────────────────
          # Each section gets its own thread with its own poll loop and its own
          # runner API calls.  A section whose runner is already idle resolves in
          # seconds without waiting for sections whose runners are still busy.
          # All threads share the same deadline so the total wall-clock wait is
          # bounded by POLL_TIMEOUT_SECS regardless of the number of sections.
          if pending_sections:
              from collections import defaultdict

              # Group sections by their runner label so that sections sharing a
              # label share a single poll thread — prevents redundant API calls
              # when multiple testplan sections target the same runner pool.
              label_to_sections = defaultdict(list)
              for entry in pending_sections:
                  label_to_sections[entry.get('runs_on', '').strip()].append(entry)

              unique_labels = sorted(label_to_sections)
              n_threads  = len(unique_labels)
              n_sections = len(pending_sections)
              print(
                  f'\nLaunching {n_threads} parallel poll thread(s)'
                  f' for {n_sections} section(s)'
                  f' (timeout={POLL_TIMEOUT_SECS // 60}m, interval={POLL_INTERVAL_SECS}s) …',
                  flush=True,
              )
              for lbl in unique_labels:
                  names = [s['name'] for s in label_to_sections[lbl]]
                  print(f'  label={lbl!r} → sections: {names}', flush=True)

              deadline = time.monotonic() + POLL_TIMEOUT_SECS

              try:
                  with ThreadPoolExecutor(max_workers=n_threads) as pool:
                      # One future per unique label, not per section.
                      # Sections sharing a label receive the same result.
                      futures = {
                          pool.submit(
                              _poll_one_section,
                              {'name': lbl, 'runs_on': lbl},
                              deadline,
                          ): lbl
                          for lbl in unique_labels
                      }
                      for future in as_completed(futures):
                          # Broadened to Exception so AttributeError / TypeError /
                          # ValueError from malformed API responses surface here
                          # instead of propagating as an unhandled exception past
                          # the try/except and leaving runner_check_status unset.
                          try:
                              _, available, reason = future.result()
                          except Exception as exc:  # noqa: BLE001
                              available = False
                              reason    = f'{type(exc).__name__}: {exc}'
                              print(f'::error::Poll thread raised unexpected error: {reason}', flush=True)

                          lbl = futures[future]
                          for entry in label_to_sections[lbl]:
                              section = entry['name']
                              if available:
                                  entry['target_available'] = 'true'
                                  entry['skip_reason']      = ''
                                  print(
                                      f'[{section}] Resolved: AVAILABLE (label={lbl!r})',
                                      flush=True,
                                  )
                              else:
                                  entry['target_available'] = 'false'
                                  entry['skip_reason']      = reason
                                  skipped.append({'name': section, 'reason': reason})
                                  print(
                                      f'[{section}] Resolved: UNAVAILABLE'
                                      f' (label={lbl!r}) — {reason}',
                                      flush=True,
                                  )
                              resolved[section] = entry
              except Exception as exc:
                  runner_check_status = f'{type(exc).__name__}: {exc}'
                  print(
                      '::error::Runner inventory preflight failed — cannot determine runner'
                      f' availability. {runner_check_status}',
                      flush=True,
                  )
                  raise SystemExit(1)

          # ── Restore testplan.ini section order ──────────────────────────────
          seen = set()
          for section in conf.sections():
              if section in resolved and section not in seen:
                  all_targets.append(resolved[section])
                  seen.add(section)

          _append_output(
              targets=all_targets,
              skipped_targets=skipped,
              runner_check_status=runner_check_status,
          )

  e2e_nightly:
    name: "${{ matrix.target.name }}"
    needs: setup_matrix
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.setup_matrix.outputs.targets) }}
    uses: ./.github/workflows/e2e-tests.yml
    with:
      name:             ${{ matrix.target.name }}
      runs_on:          ${{ matrix.target.runs_on }}
      artifact_group:   ${{ matrix.target.artifact_group }}
      gpu_arch:         ${{ matrix.target.gpu_arch || '' }}
      tests_filters:    ${{ matrix.target.tests_filters }}
      source_repo:      ${{ inputs.source_repo || 'ROCm/rockrel' }}
      artifact_source:  ${{ inputs.artifact_source || 'multi_arch_release.yml' }}
      include_dev:      ${{ inputs.include_dev || true }}
      run_id:           ${{ needs.setup_matrix.outputs.run_id || '' }}
      target_available: ${{ matrix.target.target_available || 'true' }}

  report:
    name: "Nightly Test Summary — ${{ needs.setup_matrix.outputs.run_id || inputs.artifact_source || 'latest-release' }}"
    needs: [setup_matrix, e2e_nightly]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform counts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: test-counts-*
          path: all-counts
          merge-multiple: false

      - name: Build master summary table
        env:
          RUN_ID: ${{ needs.setup_matrix.outputs.run_id || inputs.artifact_source || 'latest-release' }}
          SKIPPED_TARGETS: ${{ needs.setup_matrix.outputs.skipped_targets }}
          RUNNER_CHECK_STATUS: ${{ needs.setup_matrix.outputs.runner_check_status }}
        shell: python
        run: |
          import json, os, pathlib

          rows = []
          for counts_file in sorted(pathlib.Path("all-counts").rglob("counts.json")):
              try:
                  rows.append(json.loads(counts_file.read_text()))
              except Exception as e:
                  print(f"Skipping {counts_file}: {e}")

          raw = os.environ.get("SKIPPED_TARGETS", "").strip()
          skipped_targets = json.loads(raw) if raw else []

          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          has_skip = any(r.get("skipped", 0) > 0 for r in rows)

          lines = []
          run_id = os.environ["RUN_ID"]
          lines.append(f"## Nightly Results — {run_id} — All Platforms")
          lines.append("")
          runner_check_status = os.environ.get("RUNNER_CHECK_STATUS", "").strip()
          if runner_check_status:
              lines.append(f"> Runner availability preflight not applied: {runner_check_status}")
              lines.append("")

          if has_skip:
              lines.append("| Platform | Tests Run | Pass | Skip | Fail | Error | Status |")
              lines.append("|---|--:|--:|--:|--:|--:|---|")
          else:
              lines.append("| Platform | Tests Run | Pass | Fail | Error | Status |")
              lines.append("|---|--:|--:|--:|--:|---|")

          total_run = total_pass = total_skip = total_fail = total_err = 0
          for r in rows:
              ok = r["failed"] == 0 and r["error"] == 0 and r["total"] > 0
              status = "✅ Passed" if ok else "❌ Failed"
              if has_skip:
                  lines.append(
                      f"| {r['platform']} | {r['total']} | {r['passed']} | "
                      f"{r.get('skipped', 0)} | {r['failed']} | {r['error']} | {status} |"
                  )
              else:
                  lines.append(
                      f"| {r['platform']} | {r['total']} | {r['passed']} | "
                      f"{r['failed']} | {r['error']} | {status} |"
                  )
              total_run  += r["total"]
              total_pass += r["passed"]
              total_skip += r.get("skipped", 0)
              total_fail += r["failed"]
              total_err  += r["error"]

          for item in skipped_targets:
              if isinstance(item, dict):
                  name = item.get("name", "unknown")
                  reason = item.get("reason", "platform not available")
              else:
                  name = str(item)
                  reason = "platform not available"
              if has_skip:
                  lines.append(f"| {name} | — | — | — | — | — | ⏭ Skipped — {reason} |")
              else:
                  lines.append(f"| {name} | — | — | — | — | ⏭ Skipped — {reason} |")

          if rows:
              if has_skip:
                  lines.append(
                      f"| **TOTAL** | **{total_run}** | **{total_pass}** | "
                      f"**{total_skip}** | **{total_fail}** | **{total_err}** | |"
                  )
              else:
                  lines.append(
                      f"| **TOTAL** | **{total_run}** | **{total_pass}** | "
                      f"**{total_fail}** | **{total_err}** | |"
                  )
          else:
              lines.append("_No platform results collected._")

          lines.append("")

          with open(summary_path, "a") as f:
              f.write("\n".join(lines) + "\n")
