# testplan.ini — Test Plan Configuration.
#
# Follow this pattern for all the matrix combination for your test plan:
#   [test-job-name]
#     runs_on        = runner label (e.g. linux-mi325-1gpu-ossci-rocm-frac)
#     artifact_group = TheRock artifact group (e.g. gfx94X-dcgpu, gfx950-dcgpu)
#     gpu_arch       = GPU arch string passed to --gpu-arch (e.g. gfx942)
#     tests_filters  = pytest -m expression (e.g. "ci.nightly and hw.gpu")
#     target_available = true | false  (false → grey/skipped job, no runner consumed)
#
# Verification scope:
#   Only linux-gfx94x-MI325 and linux-gfx950-MI355 are enabled while the
#   rocmtests_nightly_results DB schema is being validated.  All other
#   platforms are set to target_available = false and will be re-enabled after
#   end-to-end verification confirms summary + case rows are populated correctly.


# ── Active platforms (DB verification subset) ────────────────────────────────

[linux-gfx94x-MI325]
  runs_on = linux-gfx942-1gpu-ossci-rocm
  artifact_group = gfx94X-dcgpu
  gpu_arch = gfx942
  tests_filters = ci.nightly and hw.gpu and runtime.fast
  target_available = false
  extra_docker_args = --env-file /etc/podinfo/gha-gpu-isolation-settings

[linux-gfx950-MI355]
  runs_on = linux-mi355-1gpu-ossci-rocm
  artifact_group = gfx950-dcgpu
  gpu_arch = gfx950
  tests_filters = ci.nightly and hw.gpu and runtime.fast
  target_available = true
  extra_docker_args = --env-file /etc/podinfo/gha-gpu-isolation-settings


